name: BUG 反馈
description: 报告一个问题或异常
title: "【BUG反馈】"
labels: ["bug"]
body:
  - type: dropdown
    id: target
    attributes:
      label: 针对
      options:
        - SnowAir 轻雪
        - SnowAir 晾衣架
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 系统版本
    validations:
      required: true
  - type: textarea
    id: desc
    attributes:
      label: 描述
      description: 发生了什么，怎么复现，期望是什么
    validations:
      required: true
